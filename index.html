<!DOCTYPE html>
<html lang="en">
 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>RC Marine Labs | Into The Sea</title>
 
<style>
 
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
 
html,
body {
height: 100%;
}
 
body {
font-family: Arial, Helvetica, sans-serif;
background: #000;
}
 
.hero {
position: relative;
height: 100vh;
width: 100%;
 
background-image:
linear-gradient(
rgba(0,0,0,0.35),
rgba(0,0,0,0.65)
),
url("./hero.jpg");
 
background-size: cover;
background-position: center;
background-repeat: no-repeat;
 
display: flex;
align-items: center;
}
 
.content {
width: min(900px, 90%);
margin-left: 7vw;
color: white;
}
 
.logo {
font-size: 42px;
font-weight: 300;
letter-spacing: 20px;
text-transform: uppercase;
color: rgba(255,255,255,0.9);
margin-bottom: 40px;
}
 
h1 {
font-size: clamp(6rem, 11vw, 10rem);
font-weight: 700;
line-height: 0.9;
margin-bottom: 40px;
text-transform: uppercase;
}
 
.lead {
max-width: 700px;
font-size: clamp(1.3rem, 2vw, 2.1rem);
line-height: 1.5;
color: rgba(255,255,255,0.95);
margin-bottom: 30px;
}
 
.text {
max-width: 650px;
font-size: clamp(1rem, 1.4vw, 1.3rem);
line-height: 1.8;
color: rgba(255,255,255,0.85);
}
 
@media (max-width: 768px) {
 
.content {
margin-left: 5vw;
}
 
.logo {
font-size: 20px;
letter-spacing: 8px;
}
 
h1 {
font-size: 4rem;
}
 
.lead {
font-size: 1.2rem;
}
 
.text {
font-size: 1rem;
}
}
 
</style>
 
</head>
 
 <body>
<section class="hero">
 
<div class="content">
 
<div class="logo">
RC MARINE LABS
</div>
 
<h1>
INTO THE SEA
</h1>
 
<div class="lead">
Innovation, exploration and marine scale technology designed for demanding conditions at sea.
</div>
 
<div class="text">
We develop, test and refine solutions built to perform when conditions become unpredictable.
</div>
 
</div>
 
</section>
 
</body>
 
</html>
