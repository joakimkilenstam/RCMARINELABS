<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RC Marine Labs | Into The Sea</title>
<meta name="description" content="RC Marine Labs develops, tests and refines marine scale technology built for demanding conditions at sea.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
  background: #05070b;
  color: #f2f3f4;
  -webkit-font-smoothing: antialiased;
}

/* Bakgrundsbild + mjuk mörk ton till vänster så texten syns */
.hero {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  background-color: #05070b;
  background-image:
    linear-gradient(90deg, rgba(3,5,9,0.45) 0%, rgba(3,5,9,0.2) 40%, rgba(3,5,9,0) 65%),
    url("hero-bg.jpg?v=2");
  background-size: cover;
  background-position: 50% 22%;
  background-repeat: no-repeat;
}

.content {
  padding: 5vh 30px 10vh clamp(24px, 3.5vw, 80px);
}

.logo {
  font-size: clamp(15px, 1.47vw, 27px);
  font-weight: 600;
  letter-spacing: 0.88em;
  color: #a9b8c4;
  margin-bottom: clamp(22px, 2.15vw, 40px);
}

h1 {
  font-size: clamp(2.7rem, 7.2vw, 9rem);
  font-weight: 600;
  letter-spacing: 0.05em;
  line-height: 1;
  margin-left: -0.04em;
  color: #f4f4f2;
}

.divider {
  width: clamp(64px, 6.3vw, 120px);
  height: 2px;
  border: 0;
  background: rgba(255,255,255,0.7);
  margin: clamp(24px, 2.6vw, 48px) 0 clamp(26px, 2.7vw, 50px);
}

.lead,
.text {
  max-width: 24em;
  font-size: clamp(1rem, 1.51vw, 1.7rem);
  font-weight: 400;
  line-height: 1.48;
  color: rgba(238,241,244,0.9);
}

.lead {
  margin-bottom: 1.48em;
}

/* Mobil: bilden flyttas så båten syns, texten läggs upptill */
@media (max-width: 768px) {
  .hero {
    align-items: flex-start;
    background-image:
      linear-gradient(180deg, rgba(3,5,9,0.8) 0%, rgba(3,5,9,0.55) 45%, rgba(3,5,9,0.1) 75%),
      url("hero-bg.jpg?v=2");
    background-position: 62% center;
  }

  .content {
    padding: 12vh 24px 40px;
  }

  .logo {
    letter-spacing: 0.6em;
  }

  .lead,
  .text {
    font-size: 1.05rem;
  }
}
</style>
</head>

<body>

<section class="hero">
  <div class="content">
    <p class="logo">RC MARINE LABS</p>

    <h1>INTO THE SEA</h1>

    <hr class="divider">

    <p class="text">We develop, test and refine solutions built to perform when conditions become unpredictable.</p>
  </div>
</section>

</body>
</html>
