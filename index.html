<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>RC Marine Labs | Into The Sea</title>
 
<style>
 
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
 
html, body {
height: 100%;
}
 
body {
font-family: Arial, Helvetica, sans-serif;
background: #000;
}
 
.hero {
position: relative;
height: 100vh;
width: 100%;
 
background-image: url("hero.jpg");
background-size: cover;
background-position: center;
background-repeat: no-repeat;
}
 
.overlay {
width: 100%;
height: 100%;
 
background: linear-gradient(
rgba(0,0,0,0.45),
rgba(0,0,0,0.75)
);
 
display: flex;
align-items: center;
}
 
.content {
max-width: 900px;
margin-left: 8vw;
padding-right: 30px;
color: white;
}
 
.logo {
font-size: 42px;
font-weight: 300;
letter-spacing: 14px;
text-transform: uppercase;
margin-bottom: 40px;
}
 
h1 {
font-size: clamp(5rem, 10vw, 9rem);
line-height: 0.9;
margin-bottom: 40px;
text-transform: uppercase;
}
 
.lead {
max-width: 800px;
font-size: clamp(1.4rem, 2vw, 2rem);
line-height: 1.5;
margin-bottom: 25px;
}
 
.text {
max-width: 700px;
font-size: 1.2rem;
line-height: 1.8;
color: rgba(255,255,255,0.9);
}
 
@media (max-width: 768px) {
 
.content {
margin-left: 5vw;
margin-right: 5vw;
}
 
.logo {
font-size: 20px;
letter-spacing: 6px;
}
 
h1 {
font-size: 4rem;
}
 
.lead {
font-size: 1.1rem;
}
 
.text {
font-size: 1rem;
}
}
 
</style>
 
</head>
 
<body>
 
<section class="hero">
 
<div class="overlay">
 
<div class="content">
 
<div class="logo">
RC MARINE LABS
</div>
 
<h1>
INTO THE SEA
</h1>
 
<div class="lead">
Innovation, exploration and marine scale technology designed for demanding conditions at sea.
</div>
 
<div class="text">
We develop, test and refine solutions built to perform when conditions become unpredictable.
</div>
 
</div>
 
</div>
 
</section>
 
</body>
</html>
